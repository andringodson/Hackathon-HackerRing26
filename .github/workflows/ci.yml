name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Run by hand (Actions tab or `gh workflow run ci`) to test and redeploy both apps.
  workflow_dispatch:

jobs:
  api-test:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

  # Builds both images and runs the stack from docker-compose.yml, the same containers every host
  # runs. Checks that real USGS/GDACS events reach the browser-facing URL through the web proxy.
  stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        run: docker compose up --build -d
      - name: Smoke test
        run: |
          wait_for() { for i in $(seq 1 60); do curl -fs -o /dev/null "$1" && return 0; sleep 2; done; return 1; }
          wait_for http://localhost:8000/api/health
          wait_for http://localhost:3000/
          curl -fs http://localhost:8000/api/health | jq .

          for path in / /dashboard /report; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:3000$path")
            echo "$path $code"; [ "$code" = 200 ]
          done

          events=$(curl -fs "http://localhost:3000/backend/api/events?range=7d")
          echo "$events" | jq -c 'group_by(.type) | map({(.[0].type): length}) | add'
          [ "$(echo "$events" | jq length)" -gt 0 ]
          id=$(echo "$events" | jq -r '.[0].id')
          curl -fs "http://localhost:3000/backend/api/events/$id" | jq -e --arg id "$id" '.id == $id'
      - name: Logs
        if: always()
        run: docker compose logs --no-color

  # Deploys to Render only after both jobs pass, and only the apps that changed. Uses deploy hooks
  # (Render: service > Settings > Deploy Hook) stored as repo secrets RENDER_DEPLOY_HOOK_WEB and
  # RENDER_DEPLOY_HOOK_API, so it works without Render's GitHub app. A missing secret is skipped.
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [api-test, stack]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Trigger Render deploys for changed apps
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          WEB_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_WEB }}
          API_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_API }}
        run: |
          if [ "$EVENT" != push ]; then
            # Run by hand: deploy both.
            changed=$'apps/web/\napps/api/'
          elif git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            changed=$(git diff --name-only "$BEFORE" HEAD)
          else
            # First push of the branch or rewritten history: deploy both.
            changed=$'apps/web/\napps/api/'
          fi
          deploy() { # name, hook, path prefix
            if ! grep -q "^$3" <<<"$changed"; then echo "$1: no changes"; return; fi
            if [ -z "$2" ]; then echo "::warning::$1 changed but its deploy hook secret is not set"; return; fi
            curl -fsS -X POST "$2" > /dev/null && echo "$1: deploy triggered"
          }
          deploy web "$WEB_HOOK" apps/web/
          deploy api "$API_HOOK" apps/api/
