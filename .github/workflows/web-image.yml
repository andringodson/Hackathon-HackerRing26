name: web image

# Builds the web Docker image and checks that the container serves pages. The same image is what
# every host runs, so a green run here means it deploys anywhere.
on:
  push:
    branches: [main]
    paths: ["apps/web/**", ".github/workflows/web-image.yml"]
  pull_request:
    paths: ["apps/web/**", ".github/workflows/web-image.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t disasterintel-web apps/web
      - name: Smoke test
        run: |
          docker run -d --name web -p 3000:3000 disasterintel-web
          for i in $(seq 1 30); do curl -fs -o /dev/null http://localhost:3000/ && break; sleep 1; done
          for path in / /dashboard /report; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:3000$path")
            echo "$path $code"
            [ "$code" = 200 ]
          done
      - name: Container logs
        if: always()
        run: docker logs web || true
