# Optional one-click setup for Render's free tier: New > Blueprint, pick this repo.
# It only points Render at the two Dockerfiles; the same images run on any container host
# (see docker-compose.yml and apps/web/README.md, "Deploy").
databases:
  - name: disasterintel-db
    plan: free # expires 30 days after creation; 1 GB
    databaseName: disasterintel
    user: disasterintel
    postgresMajorVersion: "16"
    ipAllowList: [] # private network only

services:
  - type: web
    name: disasterintel-api
    runtime: docker
    plan: free
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    healthCheckPath: /api/health
    buildFilter:
      paths: ["apps/api/**"]
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: disasterintel-db
          property: connectionString

  - type: web
    name: disasterintel-web
    runtime: docker
    plan: free
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: ./apps/web
    healthCheckPath: /
    buildFilter:
      paths: ["apps/web/**"]
    envVars:
      # Build arg: the browser calls this app's own /backend proxy.
      - key: NEXT_PUBLIC_API_URL
        value: /backend
      # Read at runtime by the proxy. Free services can't receive private-network traffic, so this is
      # the API's public URL. If Render gave the API a different address, update it here or in the
      # dashboard; a restart is enough, no rebuild.
      - key: API_URL
        value: https://disasterintel-api.onrender.com
      - key: NEXT_PUBLIC_MAP_STYLE_URL
        value: https://tiles.openfreemap.org/styles/dark
