# Optional one-click setup for Render (free tier). It only points Render at apps/web/Dockerfile;
# the same image runs on any other container host. See apps/web/README.md, "Deploy".
services:
  - type: web
    name: disasterintel-web
    runtime: docker
    plan: free
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: ./apps/web
    healthCheckPath: /
    buildFilter:
      paths: ["apps/web/**"]
    envVars:
      # Passed to the Docker build as build args. Add NEXT_PUBLIC_API_URL (and NEXT_PUBLIC_WS_URL)
      # here or in the dashboard once the backend is deployed; until then the site runs on demo data.
      - key: NEXT_PUBLIC_MAP_STYLE_URL
        value: https://tiles.openfreemap.org/styles/dark
