# Optional one-click setup for Render's free web services: New > Blueprint, connect GitHub, pick this
# repo. It only points Render at the two Dockerfiles; the same images run on any container host (see
# docker-compose.yml and README.md, "Deploy").
#
# The database is not on Render: Render's free Postgres expires after 30 days. Use a free-forever
# Postgres with PostGIS (Neon) and paste its connection string when Render asks for DATABASE_URL.
#
# Each service redeploys after a push to main that touches its app, once the GitHub checks (the ci
# workflow) pass. That needs the repo connected through Render's GitHub app.
services:
  - type: web
    name: disasterintel-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    buildFilter:
      paths: ["apps/api/**"]
    envVars:
      # Secret, so not stored here: Render asks for it when the Blueprint is created.
      - key: DATABASE_URL
        sync: false

  - type: web
    name: disasterintel-web
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: ./apps/web
    healthCheckPath: /
    autoDeployTrigger: checksPass
    buildFilter:
      paths: ["apps/web/**"]
    envVars:
      # Build arg: the browser calls this app's own /backend proxy.
      - key: NEXT_PUBLIC_API_URL
        value: /backend
      # Read at runtime by the proxy. Free services can't receive private-network traffic, so this is
      # the API's public URL. If Render gave the API a different address, update it here or in the
      # dashboard; a restart is enough, no rebuild.
      - key: API_URL
        value: https://disasterintel-api.onrender.com
      - key: NEXT_PUBLIC_MAP_STYLE_URL
        value: https://tiles.openfreemap.org/styles/dark
