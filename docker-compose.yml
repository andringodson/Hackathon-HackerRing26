# The whole stack on one machine: a laptop, or any VM (for example Oracle Cloud Always Free).
#   docker compose up --build        then open http://localhost:3000
# The web app talks to the API through its /backend proxy, so only port 3000 needs to be public.
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: disasterintel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-disasterintel}
      POSTGRES_DB: disasterintel
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "disasterintel"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  api:
    build: apps/api
    environment:
      DATABASE_URL: postgresql://disasterintel:${POSTGRES_PASSWORD:-disasterintel}@db:5432/disasterintel
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: unless-stopped

  web:
    build:
      context: apps/web
      args:
        NEXT_PUBLIC_API_URL: /backend
    environment:
      API_URL: http://api:8000
    depends_on:
      - api
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  db-data:
